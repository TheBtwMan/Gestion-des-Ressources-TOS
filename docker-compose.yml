services:
  postgres:
    image: postgres:16-alpine
    container_name: marsa-gestion-ressources-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: gestion_ressources
      POSTGRES_USER: marsa
      POSTGRES_PASSWORD: marsa
    ports:
      - "5432:5432"
    volumes:
      - marsa-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marsa -d gestion_ressources"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: marsa-tos-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gestion_ressources
      SPRING_DATASOURCE_USERNAME: marsa
      SPRING_DATASOURCE_PASSWORD: marsa
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: marsa-tos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "4200:80"
    depends_on:
      - backend

volumes:
  marsa-pg-data:
